[project]
name = "zhenyun-pangu-mcp"
version = "0.1.0"
description = "甄云盘古通用工具 MCP — 数据库(Archery)/猪齿鱼(Choerodon)/日志(阿里云 SLS 国内盘古 + Loki AWS 海外)/跨仓搜索"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
]

[project.scripts]
zhenyun-pangu-mcp = "zhenyun_pangu_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhenyun_pangu_mcp"]
